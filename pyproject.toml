[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gridshock-research-lab"
version = "0.1.0"
description = "Point-in-time-safe weather and DE-LU day-ahead power-market research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kishore Srinivasan" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<2.4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
gridshock = "gridshock.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/gridshock"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "error:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]

[tool.ruff]
extend-exclude = ["docs/superpowers"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["gridshock"]

[[tool.mypy.overrides]]
module = ["seaborn.*", "sklearn.*"]
ignore_missing_imports = true
